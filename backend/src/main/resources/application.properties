# ─── MongoDB Atlas ───────────────────────────────────────────────────────────
# Replace with your actual Atlas connection string
spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/secureauthlab?retryWrites=true&w=majority
spring.data.mongodb.database=secureauthlab

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Change this secret in production — must be 256-bit (32+ chars)
jwt.secret=secureauthlab-super-secret-key-change-in-production-2024
jwt.expiration=86400000

# ─── Security Defaults ───────────────────────────────────────────────────────
security.max-attempts=5
security.lockout-seconds=60

# ─── Admin Seed ──────────────────────────────────────────────────────────────
# Used by DataSeeder to create default admin on first run
admin.username=admin
admin.password=Admin@1234

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.secureauthlab=DEBUG
